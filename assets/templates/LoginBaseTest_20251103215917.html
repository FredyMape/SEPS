<!DOCTYPE html><html lang="es"><head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Login</title> <style>* {margin: 0;padding: 0;box-sizing: border-box;}body {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;background: linear-gradient(135deg, #e0f2f1 0%, #b2dfdb 100%);min-height: 100vh;display: flex;justify-content: center;align-items: center;padding: 20px;}.login-container {background: white;border-radius: 20px;box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);width: 100%;max-width: 400px;padding: 40px;animation: fadeIn 0.5s ease;}@keyframes fadeIn {from { opacity: 0; transform: translateY(-20px);}to { opacity: 1; transform: translateY(0);}}.logo {text-align: center;margin-bottom: 30px;}.logo h1 {color: #00897b;font-size: 32px;font-weight: 700;margin-bottom: 5px;}.logo p {color: #666;font-size: 14px;}.form-group {margin-bottom: 25px;}.form-group label {display: block;margin-bottom: 8px;color: #333;font-weight: 500;font-size: 14px;}.input-wrapper {position: relative;}.form-group input {width: 100%;padding: 12px 15px;border: 2px solid #e0e0e0;border-radius: 10px;font-size: 15px;transition: all 0.3s ease;outline: none;}.form-group input:focus {border-color: #4db6ac;box-shadow: 0 0 0 3px rgba(77, 182, 172, 0.1);}.remember-forgot {display: flex;justify-content: space-between;align-items: center;margin-bottom: 25px;font-size: 14px;}.remember-forgot label {display: flex;align-items: center;color: #666;cursor: pointer;}.remember-forgot input[type="checkbox"] {margin-right: 8px;cursor: pointer;}.remember-forgot a {color: #00897b;text-decoration: none;transition: color 0.3s;}.remember-forgot a:hover {color: #00695c;}.btn-login {width: 100%;padding: 14px;background: linear-gradient(135deg, #4db6ac 0%, #00897b 100%);color: white;border: none;border-radius: 10px;font-size: 16px;font-weight: 600;cursor: pointer;transition: transform 0.2s, box-shadow 0.3s;}.btn-login:hover {transform: translateY(-2px);box-shadow: 0 10px 25px rgba(77, 182, 172, 0.4);}.btn-login:active {transform: translateY(0);}.divider {text-align: center;margin: 25px 0;position: relative;}.divider::before {content: '';position: absolute;left: 0;top: 50%;width: 100%;height: 1px;background: #e0e0e0;}.divider span {background: white;padding: 0 15px;color: #999;font-size: 14px;position: relative;z-index: 1;}.social-login {display: flex;gap: 15px;margin-bottom: 25px;}.social-btn {flex: 1;padding: 12px;border: 2px solid #e0e0e0;border-radius: 10px;background: white;cursor: pointer;transition: all 0.3s;display: flex;align-items: center;justify-content: center;gap: 8px;font-size: 14px;font-weight: 500;}.social-btn:hover {border-color: #667eea;background: #f8f9ff;}.signup-link {text-align: center;color: #666;font-size: 14px;}.signup-link a {color: #667eea;text-decoration: none;font-weight: 600;transition: color 0.3s;}.signup-link a:hover {color: #764ba2;} </style></head><body> <div class="login-container"><div class="logo"><h1>Bienvenido</h1><p>Inicia sesión para continuar</p></div><form id="loginForm"><div class="form-group"> <label for="email">Correo electrónico</label> <div class="input-wrapper"><input type="email" id="email" placeholder="tu@email.com" required> </div></div><div class="form-group"> <label for="password">Contraseña</label> <div class="input-wrapper"><input type="password" id="password" placeholder="••••••••" required> </div></div><div class="remember-forgot"> <label><input type="checkbox" id="remember">Recordarme </label> <a href="#" onclick="alert('Función de recuperación'); return false;">¿Olvidaste tu contraseña?</a></div><button type="submit" class="btn-login">Iniciar Sesión</button></form><div class="divider"><span>O continúa con</span></div><div class="social-login"><button class="social-btn" onclick="alert('Login con Google')"> <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z"/> </svg> Google</button><button class="social-btn" onclick="alert('Login con Apple')"> <svg width="18" height="18" viewBox="0 0 18 18"><path d="M14.3 9.4c0-1.8 1.5-2.7 1.6-2.8-1-.1-2-.9-2.4-2-.3-.9-.6-2 .1-3.1 1.4-.2 2.8.8 3.5 1.7.9 1.2.9 2.7.1 3.9-.5.7-1.2 1.3-2 1.7-.2.1-.5.2-.7.3v.1c.2.1.4.2.6.4.8.5 1.4 1.3 1.7 2.2.2.6.2 1.3 0 1.9-.3 1-1 1.8-2 2.2-.7.3-1.5.4-2.3.3-1.4-.2-2.6-1-3.3-2.2-.4-.6-.6-1.4-.6-2.1 0-1.3.6-2.5 1.6-3.3.6-.5 1.3-.8 2.1-1.1zm-2.8-6.9c-.8-.9-1.9-1.4-3.1-1.4-1.3 0-2.5.7-3.1 1.8-.5.8-.7 1.8-.5 2.7.2.9.7 1.6 1.5 2.1.5.3 1.1.5 1.7.5.8 0 1.5-.3 2.1-.8.8-.7 1.2-1.7 1.2-2.7 0-.8-.3-1.5-.8-2.2z"/> </svg> Apple</button></div><div class="signup-link">¿No tienes cuenta? <a href="#" onclick="alert('Ir a registro'); return false;">Regístrate</a></div> </div> <script>document.getElementById('loginForm').addEventListener('submit', function(e) {e.preventDefault();const email = document.getElementById('email').value;const password = document.getElementById('password').value;alert('Login exitoso!
Email: ' + email);}); </script></body></html>
